<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">Reusable interconnect IP evaluation scorecard</title><desc id="d">A decision checklist comparing candidate interconnect IP against requirements. No scores or winner are assigned because the target CPU bus and requirements are not yet fixed.</desc>
<defs><style>.h{font:700 27px Arial;fill:#101828}.sub{font:16px Arial;fill:#475467}.head{fill:#344054}.ht{font:700 15px Arial;fill:#fff}.cell{fill:#f8fafc;stroke:#d0d5dd;stroke-width:1}.ct{font:14px Arial;fill:#344054}.bold{font:700 14px Arial;fill:#101828}.note{fill:#fff7e6;stroke:#b54708;stroke-width:2;rx:12}</style></defs><rect width="1200" height="760" fill="#fff"/>
<text x="50" y="52" class="h">Reusable interconnect IP — evaluation scorecard</text><text x="50" y="80" class="sub">Use this checklist to compare candidates after the target bus and requirements are known.</text>
<rect x="50" y="115" width="1100" height="46" class="head"/>
<text x="65" y="143" class="ht">Criterion</text><text x="350" y="143" class="ht">What evidence to collect</text><text x="850" y="143" class="ht">Status today</text>
<g>
<rect x="50" y="161" width="1100" height="53" class="cell"/><text x="65" y="192" class="bold">Native bus compatibility</text><text x="350" y="192" class="ct">AXI / AHB / APB / other; adapter required?</text><text x="850" y="192" class="ct">OPEN — target MIPS bus unknown</text>
<rect x="50" y="214" width="1100" height="53" class="cell"/><text x="65" y="245" class="bold">Transaction semantics</text><text x="350" y="245" class="ct">Read/write, ordering, outstanding requests, IDs</text><text x="850" y="245" class="ct">OPEN — requirements needed</text>
<rect x="50" y="267" width="1100" height="53" class="cell"/><text x="65" y="298" class="bold">Routing and arbitration</text><text x="350" y="298" class="ct">Address map, masters/targets, fairness policy</text><text x="850" y="298" class="ct">Compare each candidate</text>
<rect x="50" y="320" width="1100" height="53" class="cell"/><text x="65" y="351" class="bold">Errors and backpressure</text><text x="350" y="351" class="ct">Unmapped address, response errors, stall behavior</text><text x="850" y="351" class="ct">Requirements + tests needed</text>
<rect x="50" y="373" width="1100" height="53" class="cell"/><text x="65" y="404" class="bold">Verification evidence</text><text x="350" y="404" class="ct">Regression, coverage, corner cases, maintenance</text><text x="850" y="404" class="ct">Collect upstream evidence</text>
<rect x="50" y="426" width="1100" height="53" class="cell"/><text x="65" y="457" class="bold">License / commercial access</text><text x="350" y="457" class="ct">License text, usage limits, revenue/royalty terms</text><text x="850" y="457" class="ct">Confirm directly; do not assume</text>
<rect x="50" y="479" width="1100" height="53" class="cell"/><text x="65" y="510" class="bold">Integration cost</text><text x="350" y="510" class="ct">Toolchain, clock/reset, configuration, dependencies</text><text x="850" y="510" class="ct">Estimate after shortlist</text>
</g>
<rect x="50" y="565" width="1100" height="105" class="note"/><text x="75" y="596" class="bold">Decision rule</text><text x="75" y="623" class="ct">First eliminate candidates incompatible with the actual host bus or unacceptable license terms.</text><text x="75" y="647" class="ct">Then compare the remaining options against required features and verifiable evidence. Do not assign scores yet.</text>
<text x="50" y="710" class="sub">Candidates currently under research: Arm CoreLink NIC-400 • PULP Platform AXI • dpretet/axi-crossbar.</text><text x="50" y="735" class="sub">No candidate is selected; the matrix deliberately contains no fabricated scores.</text></svg>