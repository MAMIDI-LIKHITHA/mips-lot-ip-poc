name: OpenMIPS native cache to LOT integration smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "rtl/mips_if/openmips_native_addr_guard.sv"
      - "rtl/mips_if/openmips_native_cache_adapter.sv"
      - "rtl/mips_if/openmips_native_cache_lot_wrapper.sv"
      - "rtl/mips_if/openmips_lot_memory_bridge.sv"
      - "rtl/mips_if/openmips_lot_access_classifier.sv"
      - "scripts/apply-openmips-cache-qualification.py"
      - "tb/tb_openmips_native_cache_lot.sv"
      - ".github/workflows/openmips-native-cache-lot-smoke.yml"
  pull_request:
    paths:
      - "rtl/mips_if/openmips_native_addr_guard.sv"
      - "rtl/mips_if/openmips_native_cache_adapter.sv"
      - "rtl/mips_if/openmips_native_cache_lot_wrapper.sv"
      - "rtl/mips_if/openmips_lot_memory_bridge.sv"
      - "rtl/mips_if/openmips_lot_access_classifier.sv"
      - "scripts/apply-openmips-cache-qualification.py"
      - "tb/tb_openmips_native_cache_lot.sv"
      - ".github/workflows/openmips-native-cache-lot-smoke.yml"
jobs:
  native-cache-to-lot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned OpenMIPS source
        uses: actions/checkout@v4
        with:
          repository: grantae/OpenMIPS
          ref: d606b35e9d5260aef20de2a58660c8303a681e9c
          path: upstream/OpenMIPS
      - name: Apply reviewed cache qualification patch
        run: python3 scripts/apply-openmips-cache-qualification.py
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile actual cache plus adapter and bridge
        run: |
          iverilog -g2012 -I upstream/OpenMIPS/hardware/src/MIPS32/Cache/DCache             -I upstream/OpenMIPS/hardware/src/MIPS32/Core             -s tb_openmips_native_cache_lot -o /tmp/native-cache-lot.vvp             upstream/OpenMIPS/hardware/src/MIPS32/Cache/DCache/DataCache_2KB.v             upstream/OpenMIPS/hardware/src/MIPS32/Cache/DCache/Set_RW_128x64.v             upstream/OpenMIPS/hardware/src/MIPS32/Cache/DCache/TagFlagRam_RW_64.v             upstream/OpenMIPS/hardware/src/Common/RAM/RAM_SP_ZI.v             upstream/OpenMIPS/hardware/src/Common/FIFO/FIFO.v             upstream/OpenMIPS/hardware/src/Common/SRAM.v             upstream/OpenMIPS/hardware/src/Common/DFF_E.v             upstream/OpenMIPS/hardware/src/Common/DFF_SRE.v             rtl/mips_if/openmips_native_addr_guard.sv             rtl/mips_if/openmips_native_cache_adapter.sv             rtl/mips_if/openmips_lot_access_classifier.sv             rtl/mips_if/openmips_lot_memory_bridge.sv             rtl/mips_if/openmips_native_cache_lot_wrapper.sv             tb/tb_openmips_native_cache_lot.sv
      - name: Run native cache to LOT integration test
        run: vvp -n /tmp/native-cache-lot.vvp
