name: OpenMIPS native cache-port smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tb/tb_openmips_native_cache_port.sv"
      - "patches/openmips/0001-cache-queue-paddr-valid.patch"
      - "tb/models/openmips_bram_model.sv"
      - ".github/workflows/openmips-native-cache-port-smoke.yml"
  pull_request:
    paths:
      - "tb/tb_openmips_native_cache_port.sv"
      - "tb/models/openmips_bram_model.sv"
      - ".github/workflows/openmips-native-cache-port-smoke.yml"
jobs:
  native-cache-port:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned OpenMIPS source
        uses: actions/checkout@v4
        with:
          repository: grantae/OpenMIPS
          ref: d606b35e9d5260aef20de2a58660c8303a681e9c
          path: upstream/OpenMIPS
      - name: Apply reviewed cache qualification patch
        run: |
          git -C upstream/OpenMIPS apply --check "$GITHUB_WORKSPACE/patches/openmips/0001-cache-queue-paddr-valid.patch"
          git -C upstream/OpenMIPS apply "$GITHUB_WORKSPACE/patches/openmips/0001-cache-queue-paddr-valid.patch"
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile actual upstream DataCache_2KB
        run: |
          iverilog -g2012 -I upstream/OpenMIPS/hardware/src/MIPS32/Cache/DCache \
            -I upstream/OpenMIPS/hardware/src/MIPS32/Core \
            -s tb_openmips_native_cache_port -o /tmp/native-cache.vvp \
            upstream/OpenMIPS/hardware/src/MIPS32/Cache/DCache/DataCache_2KB.v \
            upstream/OpenMIPS/hardware/src/MIPS32/Cache/DCache/Set_RW_128x64.v \
            upstream/OpenMIPS/hardware/src/MIPS32/Cache/DCache/TagFlagRam_RW_64.v \
            upstream/OpenMIPS/hardware/src/Common/RAM/RAM_SP_ZI.v \
            upstream/OpenMIPS/hardware/src/Common/FIFO/FIFO.v \
            upstream/OpenMIPS/hardware/src/Common/SRAM.v \
            upstream/OpenMIPS/hardware/src/Common/DFF_E.v \
            upstream/OpenMIPS/hardware/src/Common/DFF_SRE.v \
            tb/models/openmips_bram_model.sv tb/tb_openmips_native_cache_port.sv
      - name: Run native cache-port smoke test
        run: vvp -n /tmp/native-cache.vvp
