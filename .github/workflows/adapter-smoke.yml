name: Candidate MIPS adapter smoke test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rtl/mips_if/mips_mmio_adapter_candidate.sv"
      - "tb/tb_mips_mmio_adapter_candidate.sv"
      - "rtl/crossbar/xbar_scheduler.sv"
      - "rtl/crossbar/xbar_4x4.sv"
      - "rtl/interconnect/lot_rsp_router.sv"
      - "tb/tb_lot_rsp_router.sv"
      - "tb/tb_end_to_end_candidate.sv"
      - "rtl/endpoints/lot_endpoint_adapter.sv"
      - "rtl/interconnect/lot_txn_router.sv"
      - "tb/tb_lot_txn_router.sv"
      - "tb/tb_xbar_backpressure_stability.sv"
      - "tb/tb_xbar_invalid_dst.sv"
      - "tb/tb_xbar_multi_output.sv"
      - "tb/tb_xbar_reset.sv"
      - "tb/tb_xbar_stress_latency.sv"
      - "tb/tb_xbar_4x4.sv"
      - "tb/tb_xbar_parameter_sanity.sv"
      - ".github/workflows/adapter-smoke.yml"
  push:
    branches: [main]
    paths:
      - "rtl/mips_if/mips_mmio_adapter_candidate.sv"
      - "tb/tb_mips_mmio_adapter_candidate.sv"
      - "rtl/crossbar/xbar_scheduler.sv"
      - "rtl/crossbar/xbar_4x4.sv"
      - "rtl/interconnect/lot_rsp_router.sv"
      - "tb/tb_lot_rsp_router.sv"
      - "tb/tb_end_to_end_candidate.sv"
      - "rtl/endpoints/lot_endpoint_adapter.sv"
      - "rtl/interconnect/lot_txn_router.sv"
      - "tb/tb_xbar_backpressure_stability.sv"
      - "tb/tb_xbar_invalid_dst.sv"
      - "tb/tb_xbar_multi_output.sv"
      - "tb/tb_xbar_reset.sv"
      - "tb/tb_xbar_stress_latency.sv"
      - "tb/tb_xbar_4x4.sv"
      - "tb/tb_xbar_parameter_sanity.sv"
      - ".github/workflows/adapter-smoke.yml"

jobs:
  iverilog-adapter-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile candidate adapter test
        run: |
          iverilog -g2012 -s tb_mips_mmio_adapter_candidate \
            -o /tmp/adapter-smoke.vvp \
            rtl/mips_if/mips_mmio_adapter_candidate.sv \
            tb/tb_mips_mmio_adapter_candidate.sv
      - name: Run candidate adapter test
        run: vvp -n /tmp/adapter-smoke.vvp

  verilator-response-router-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Compile response-router test
        run: |
          verilator --binary --timing -Wno-fatal \
            --top-module tb_lot_rsp_router \
            --Mdir /tmp/obj_rsp_router \
            rtl/interconnect/lot_rsp_router.sv \
            tb/tb_lot_rsp_router.sv
      - name: Run response-router test
        run: /tmp/obj_rsp_router/Vtb_lot_rsp_router

  verilator-transaction-router-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Compile transaction-router test
        run: |
          verilator --binary --timing -Wno-fatal \
            --top-module tb_lot_txn_router \
            --Mdir /tmp/obj_txn_router \
            rtl/crossbar/xbar_scheduler.sv \
            rtl/crossbar/xbar_4x4.sv \
            rtl/interconnect/lot_txn_router.sv \
            tb/tb_lot_txn_router.sv
      - name: Run transaction-router test
        run: /tmp/obj_txn_router/Vtb_lot_txn_router
      - name: Compile crossbar backpressure stability test
        run: verilator --binary --timing -Wno-fatal --top-module tb_xbar_backpressure_stability --Mdir /tmp/obj_xbar_backpressure rtl/crossbar/xbar_scheduler.sv rtl/crossbar/xbar_4x4.sv tb/tb_xbar_backpressure_stability.sv
      - name: Run crossbar backpressure stability test
        run: /tmp/obj_xbar_backpressure/Vtb_xbar_backpressure_stability
      - name: Compile parameterized invalid-destination crossbar test
        run: verilator --binary --timing -Wno-fatal --top-module tb_xbar_invalid_dst --Mdir /tmp/obj_xbar_invalid_dst rtl/crossbar/xbar_scheduler.sv rtl/crossbar/xbar_4x4.sv tb/tb_xbar_invalid_dst.sv
      - name: Run parameterized invalid-destination crossbar test
        run: timeout 60s /tmp/obj_xbar_invalid_dst/Vtb_xbar_invalid_dst
      - name: Compile parameterized multi-output crossbar test
        run: verilator --binary --timing -Wno-fatal --top-module tb_xbar_multi_output --Mdir /tmp/obj_xbar_multi_output rtl/crossbar/xbar_scheduler.sv rtl/crossbar/xbar_4x4.sv tb/tb_xbar_multi_output.sv
      - name: Run parameterized multi-output crossbar test
        run: timeout 60s /tmp/obj_xbar_multi_output/Vtb_xbar_multi_output
      - name: Compile crossbar reset test
        run: verilator --binary --timing -Wno-fatal --top-module tb_xbar_reset --Mdir /tmp/obj_xbar_reset rtl/crossbar/xbar_scheduler.sv rtl/crossbar/xbar_4x4.sv tb/tb_xbar_reset.sv
      - name: Run crossbar reset test
        run: /tmp/obj_xbar_reset/Vtb_xbar_reset
      - name: Compile crossbar stress/latency test
        run: verilator --binary --timing -Wno-fatal --top-module tb_xbar_stress_latency --Mdir /tmp/obj_xbar_stress_latency rtl/crossbar/xbar_scheduler.sv rtl/crossbar/xbar_4x4.sv tb/tb_xbar_stress_latency.sv
      - name: Run crossbar stress/latency test
        run: timeout 60s /tmp/obj_xbar_stress_latency/Vtb_xbar_stress_latency
      - name: Announce core crossbar regression
        run: echo "Running packed-vector crossbar regression under Verilator"
      - name: Compile core crossbar regression
        run: verilator --binary --timing -Wno-fatal --top-module tb_xbar_4x4 --Mdir /tmp/obj_xbar_4x4 rtl/crossbar/xbar_scheduler.sv rtl/crossbar/xbar_4x4.sv tb/tb_xbar_4x4.sv
      - name: Run core crossbar regression
        run: timeout 60s /tmp/obj_xbar_4x4/Vtb_xbar_4x4
      - name: Compile crossbar parameter sanity test
        run: verilator --binary --timing -Wno-fatal --top-module tb_xbar_parameter_sanity --Mdir /tmp/obj_xbar_parameter_sanity rtl/crossbar/xbar_scheduler.sv rtl/crossbar/xbar_4x4.sv tb/tb_xbar_parameter_sanity.sv
      - name: Run crossbar parameter sanity test
        run: timeout 60s /tmp/obj_xbar_parameter_sanity/Vtb_xbar_parameter_sanity

  verilator-end-to-end-candidate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Compile end-to-end candidate test
        run: |
          verilator --binary --timing -Wno-fatal \
            --top-module tb_end_to_end_candidate \
            --Mdir /tmp/obj_end_to_end \
            rtl/mips_if/mips_mmio_adapter_candidate.sv \
            rtl/interconnect/lot_txn_router.sv \
            rtl/crossbar/xbar_scheduler.sv \
            rtl/crossbar/xbar_4x4.sv \
            rtl/interconnect/lot_rsp_router.sv \
            rtl/endpoints/lot_endpoint_adapter.sv \
            tb/tb_end_to_end_candidate.sv
      - name: Run end-to-end candidate test
        run: timeout 60s /tmp/obj_end_to_end/Vtb_end_to_end_candidate
