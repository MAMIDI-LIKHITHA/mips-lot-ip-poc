name: Candidate MIPS adapter smoke test

on:
  pull_request:
    paths:
      - "rtl/mips_if/mips_mmio_adapter_candidate.sv"
      - "tb/tb_mips_mmio_adapter_candidate.sv"
      - "rtl/crossbar/xbar_scheduler.sv"
      - "rtl/crossbar/xbar_4x4.sv"
      - "rtl/interconnect/lot_rsp_router.sv"
      - "tb/tb_lot_rsp_router.sv"
      - ".github/workflows/adapter-smoke.yml"
  push:
    branches: [main]
    paths:
      - "rtl/mips_if/mips_mmio_adapter_candidate.sv"
      - "tb/tb_mips_mmio_adapter_candidate.sv"
      - "rtl/crossbar/xbar_scheduler.sv"
      - "rtl/crossbar/xbar_4x4.sv"
      - "rtl/interconnect/lot_rsp_router.sv"
      - "tb/tb_lot_rsp_router.sv"
      - ".github/workflows/adapter-smoke.yml"

jobs:
  iverilog-adapter-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile candidate adapter test
        run: |
          iverilog -g2012 -s tb_mips_mmio_adapter_candidate \
            -o /tmp/adapter-smoke.vvp \
            rtl/mips_if/mips_mmio_adapter_candidate.sv \
            tb/tb_mips_mmio_adapter_candidate.sv
      - name: Run candidate adapter test
        run: vvp -n /tmp/adapter-smoke.vvp

  iverilog-response-router-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile response-router test
        run: |
          iverilog -g2012 -s tb_lot_rsp_router \
            -o /tmp/rsp-router-smoke.vvp \
            rtl/crossbar/xbar_scheduler.sv \
            rtl/crossbar/xbar_4x4.sv \
            rtl/interconnect/lot_rsp_router.sv \
            tb/tb_lot_rsp_router.sv
      - name: Run response-router test
        run: vvp -n /tmp/rsp-router-smoke.vvp
